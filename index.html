<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Remote EMDR Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.8rem; color: #00adb5; }
        .subtitle { color: #aaaaaa; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .lang-container { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
        .lang-select { background-color: #2a2a2a; color: white; border: 1px solid #444; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .lang-select:focus { outline: none; border-color: #00adb5; }

        .status { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-weight: bold; background-color: #ff4d4d; }
        .status.connected { background-color: #00c853; }
        .status.remote-only { background-color: #f1c40f; color: #121212; }
        
        /* Therapist Code Small Box Display */
        .therapist-code-badge {
            display: none;
            background-color: #121212;
            border: 1px solid #00adb5;
            color: #00adb5;
            padding: 0.4rem;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        body.is-therapist .therapist-code-badge { display: block; }

        .therapist-alerts { display: block; margin-bottom: 1rem; }
        body.is-patient .therapist-alerts { display: none !important; }
        .alert-banner { padding: 0.6rem; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem; text-align: center; display: none; }
        .alert-banner.warn { background-color: #d63031; color: white; display: block; animation: pulse 2s infinite; }
        .alert-banner.info-ready { background-color: #00adb5; color: white; display: block; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .roster-box { display: flex; justify-content: space-around; background-color: #121212; padding: 0.5rem; border-radius: 6px; margin-bottom: 1.5rem; border: 1px solid #333; font-size: 0.85rem; }
        .roster-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #555; margin-right: 5px; }
        .roster-dot.online { background-color: #00c853; box-shadow: 0 0 8px #00c853; }

        .room-box { background-color: #2a2a2a; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: left; }
        .room-box label { font-weight: bold; margin-bottom: 0.75rem; display: block; color: #eeeeee; }
        
        .role-switch-container { position: relative; display: flex; background-color: #121212; border: 2px solid #444; border-radius: 8px; margin-bottom: 1.5rem; padding: 2px; cursor: pointer; user-select: none; }
        .role-btn { flex: 1; text-align: center; padding: 0.6rem 0; font-weight: bold; font-size: 0.95rem; color: #888888; z-index: 2; transition: color 0.2s ease; }
        .role-btn.active { color: #ffffff; }
        .switch-slider { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); background-color: #00adb5; border-radius: 6px; z-index: 1; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        body.select-patient .switch-slider { transform: translateX(100%); }

        .input-area { margin-bottom: 1.25rem; }
        .code-display { font-size: 2.2rem; font-weight: bold; letter-spacing: 4px; color: #00adb5; text-align: center; background: #121212; padding: 0.5rem; border-radius: 6px; border: 1px dashed #00adb5; margin-bottom: 0.5rem; }
        .code-instruction { font-size: 0.8rem; color: #aaaaaa; text-align: center; display: block; }
        .room-box input[type="text"] { width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 6px; border: 2px solid #444; background-color: #121212; color: #fff; font-size: 1.1rem; text-align: center; letter-spacing: 2px; }
        
        .room-box button { width: 100%; padding: 0.75rem; background-color: #00adb5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .room-box button:hover { background-color: #008c95; }
        
        .app-content { display: none; }
        .app-content.active { display: block; }

        .patient-hidden { display: block; }
        body.is-patient .patient-hidden { display: none !important; }

        .patient-panic-box { display: none; margin-bottom: 2rem; }
        body.is-patient .patient-panic-box { display: block; }
        .panic-btn { width: 100%; padding: 1.25rem; background-color: #d63031; color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(214, 48, 49, 0.4); transition: background 0.2s; }
        .panic-btn:hover { background-color: #b32627; }

        .switch-container { display: flex; align-items: center; justify-content: space-between; background-color: #2a2a2a; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; }
        .switch-label { font-weight: bold; color: #eeeeee; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555555; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #00adb5; }
        input:checked + .slider:before { transform: translateX(26px); }

        .control-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #eeeeee; font-size: 0.9rem; }
        input[type="range"] { width: 100%; margin-bottom: 0.25rem; }
        .value-display { font-size: 0.85rem; color: #00adb5; text-align: right; display: block; }
        
        .side-indicator { display: flex; justify-content: space-between; margin-top: 1rem; font-size: 0.8rem; font-weight: bold; color: #555555; }
        .side-indicator .active { color: #00adb5; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="container">
    <div class="lang-container" id="lang-picker-wrapper">
        <select class="lang-select" id="lang-selector"></select>
    </div>

    <h1 id="main-title">EMDR Tappers</h1>
    <div class="subtitle" id="main-sub">Secure Bilateral Stimulation</div>

    <div class="room-box" id="setup-box">
        <label id="label-role">1. Select Your Role</label>
        <div class="role-switch-container" id="role-toggle-bar">
            <div class="switch-slider" id="ui-slider-block"></div>
            <div class="role-btn active" id="btn-therapist">Therapist</div>
            <div class="role-btn" id="btn-patient">Patient</div>
        </div>
        
        <label id="input-heading">Your Session Code</label>
        <div class="input-area">
            <div id="therapist-code-view">
                <div class="code-display" id="generated-code-text">XXXX</div>
                <span class="code-instruction" id="text-share-inst">Share this code with your patient.</span>
            </div>
            <div id="patient-code-view" style="display: none;">
                <input type="text" id="room-input" placeholder="Code" maxlength="4">
            </div>
        </div>
        
        <button id="join-btn">Start Session</button>
    </div>
    
    <div id="app-content" class="app-content">
        <div id="status" class="status">Disconnected</div>

        <!-- Small session code badge frame for the therapist view -->
        <div id="therapist-badge-frame" class="therapist-code-badge">Code: XXXX</div>

        <div class="therapist-alerts">
            <div id="alert-stopped" class="alert-banner warn">⚠️ Patient stopped stimulation!</div>
            <div id="alert-ready" class="alert-banner info-ready">✓ Patient controller connected & ready</div>
        </div>

        <div class="roster-box">
            <span><span id="roster-t-dot" class="roster-dot"></span><span id="txt-rost-t">Therapist</span></span>
            <span><span id="roster-p-dot" class="roster-dot"></span><span id="txt-rost-p">Patient</span></span>
        </div>
        
        <div class="patient-panic-box">
            <button class="panic-btn" id="panic-stop-btn">STOP STIMULATION</button>
        </div>

        <div class="patient-hidden">
            <div class="switch-container">
                <span class="switch-label" id="label-bls">Bilateral Stimulation</span>
                <label class="switch">
                    <input type="checkbox" id="power-switch">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="control-group">
                <label for="speed" id="label-speed">Speed (Slow ◄► Fast)</label>
                <input type="range" id="speed" min="1" max="10" value="5" step="1">
                <span class="value-display" id="speed-val">Level 5</span>
            </div>

            <div class="control-group">
                <label for="duration" id="label-duration">Pulse Duration (Length of tap)</label>
                <input type="range" id="duration" min="40" max="500" value="120" step="10">
                <span class="value-display" id="duration-val">120 ms</span>
            </div>

            <div class="control-group">
                <label for="intensity" id="label-intensity">Vibration Intensity</label>
                <input type="range" id="intensity" min="0.1" max="1" value="0.6" step="0.05">
                <span class="value-display" id="intensity-val">60%</span>
            </div>
        </div>

        <div class="side-indicator">
            <span id="left-label">◄ LEFT MOTOR</span>
            <span id="right-label">RIGHT MOTOR ►</span>
        </div>
    </div>
</div>

<script>
    const translations = {
        en: {
            title: "EMDR Tappers", subtitle: "Secure Bilateral Stimulation",
            role: "1. Select Your Role", therapist: "Therapist", patient: "Patient",
            t_heading: "Your Session Code", p_heading: "Enter Therapist's Code",
            share_inst: "Share this code with your patient.", btn_start: "Start Session",
            btn_join: "Join Session", panic: "STOP STIMULATION", bls: "Bilateral Stimulation",
            speed: "Speed (Slow ◄► Fast)", duration: "Pulse Duration (Length of tap)",
            intensity: "Vibration Intensity", lvl: "Level", left_m: "◄ LEFT MOTOR",
            right_m: "RIGHT MOTOR ►", t_alert_stop: "⚠️ Patient stopped stimulation!",
            t_alert_ready: "✓ Patient controller connected & ready", txt_t: "Therapist",
            txt_p: "Patient", status_disc: "Disconnected", status_wait: "Connected. Awaiting Controller Binding...",
            status_ready: "Controller Synced & Ready", status_active: "Session Active",
            err_code: "Please enter the exact 4-character code provided by the therapist."
        },
        de: {
            title: "EMDR Tappers", subtitle: "Sichere bilaterale Stimulation",
            role: "1. Wählen Sie Ihre Rolle", therapist: "Therapeut", patient: "Patient",
            t_heading: "Ihr Sitzungscode", p_heading: "Code des Therapeuten eingeben",
            share_inst: "Teilen Sie diesen Code mit Ihrem Patienten.", btn_start: "Sitzung starten",
            btn_join: "Sitzung beitreten", panic: "STIMULATION STOPPEN", bls: "Bilaterale Stimulation",
            speed: "Geschwindigkeit (Langsam ◄► Schnell)", duration: "Impulsdauer (Länge des Tippens)",
            intensity: "Vibrationsintensität", lvl: "Stufe", left_m: "◄ LINKER MOTOR",
            right_m: "RECHTER MOTOR ►", t_alert_stop: "⚠️ Patient hat die Stimulation gestoppt!",
            t_alert_ready: "✓ Patient-Controller verbunden & bereit", txt_t: "Therapeut",
            txt_p: "Patient", status_disc: "Getrennt", status_wait: "Verbunden. Warte auf Controller...",
            status_ready: "Controller synchronisiert & bereit", status_active: "Sitzung Aktiv",
            err_code: "Bitte geben Sie den exakten 4-stelligen Code ein, den Sie vom Therapeuten erhalten haben."
        },
        es: {
            title: "EMDR Tappers", subtitle: "Estimulación Bilateral Segura",
            role: "1. Seleccione su Rol", therapist: "Terapeuta", patient: "Paciente",
            t_heading: "Su Código de Sesión", p_heading: "Ingrese Código del Terapeuta",
            share_inst: "Comparta este código con su paciente.", btn_start: "Iniciar Sesión",
            btn_join: "Unirse a la Sesión", panic: "DETENER ESTIMULACIÓN", bls: "Estimulación Bilateral",
            speed: "Velocidad (Lento ◄► Rápido)", duration: "Duración del Pulso (Longitud del toque)",
            intensity: "Intensidad de Vibración", lvl: "Nivel", left_m: "◄ MOTOR IZQUIERDO",
            right_m: "MOTOR DERECHO ►", t_alert_stop: "⚠️ ¡El paciente detuvo la estimulación!",
            t_alert_ready: "✓ Mando del paciente conectado y listo", txt_t: "Terapeuta",
            txt_p: "Paciente", status_disc: "Desconectado", status_wait: "Conectado. Esperando vinculación del mando...",
            status_ready: "Mando sincronizado y listo", status_active: "Sesión Activa",
            err_code: "Por favor, ingrese el código exacto de 4 caracteres proporcionado por el terapeuta."
        },
        fr: {
            title: "EMDR Tappers", subtitle: "Stimulation Bilatérale Sécurisée",
            role: "1. Sélectionnez Votre Rôle", therapist: "Thérapeute", patient: "Patient",
            t_heading: "Votre Code de Session", p_heading: "Entrez le Code du Thérapeute",
            share_inst: "Partagez ce code avec votre patient.", btn_start: "Démarrer la Session",
            btn_join: "Rejoindre la Session", panic: "ARRÊTER LA STIMULATION", bls: "Stimulation Bilatérale",
            speed: "Vitesse (Lent ◄► Rapide)", duration: "Durée de l'Impulsion (Longueur de la tape)",
            intensity: "Intensité de Vibration", lvl: "Niveau", left_m: "◄ MOTEUR GAUCHE",
            right_m: "MOTEUR DROIT ►", t_alert_stop: "⚠️ Le patient a arrêté la stimulation !",
            t_alert_ready: "✓ Manette du patient connectée & prête", txt_t: "Thérapeute",
            txt_p: "Patient", status_disc: "Déconnecté", status_wait: "Connecté. En attente de la manette...",
            status_ready: "Manette synchronisée & prête", status_active: "Session Active",
            err_code: "Veuillez saisir le code exact à 4 caractères fourni par le thérapeute."
        },
        nl: {
            title: "EMDR Tappers", subtitle: "Veilige Bilaterale Stimulatie",
            role: "1. Kies Uw Rol", therapist: "Therapeut", patient: "Patiënt",
            t_heading: "Uw Sessiecode", p_heading: "Voer Code van Therapeut in",
            share_inst: "Deel deze code met uw patiënt.", btn_start: "Sessie Starten",
            btn_join: "Deelnemen aan Sessie", panic: "STIMULATIE STOPPEN", bls: "Bilaterale Stimulatie",
            speed: "Snelheid (Langzaam ◄► Snel)", duration: "Pulsduur (Lengte van de tik)",
            intensity: "Vibratie-intensiteit", lvl: "Niveau", left_m: "◄ LINKER MOTOR",
            right_m: "RECHTER MOTOR ►", t_alert_stop: "⚠️ Patiënt heeft stimulatie gestopt!",
            t_alert_ready: "✓ Controller van patiënt verbonden & klaar", txt_t: "Therapeut",
            txt_p: "Patiënt", status_disc: "Verbinding verbroken", status_wait: "Verbonden. Wachten op controller...",
            status_ready: "Controller gekoppeld & klaar", status_active: "Sessie Actief",
            err_code: "Voer de exacte 4-cijferige code in die door de therapeut is verstrekt."
        }
    };

    const languageConfig = [
        { code: "de", name: "Deutsch" },
        { code: "en", name: "English" },
        { code: "es", name: "Español" },
        { code: "fr", name: "Français" },
        { code: "nl", name: "Nederlands" }
    ];

    let currentLang = "en";
    const selector = document.getElementById('lang-selector');

    languageConfig.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang.code;
        opt.textContent = lang.name;
        if(lang.code === "en") opt.selected = true;
        selector.appendChild(opt);
    });

    function applyLocalization(langCode) {
        currentLang = langCode;
        const dict = translations[langCode];
        
        document.getElementById('main-title').textContent = dict.title;
        document.getElementById('main-sub').textContent = dict.subtitle;
        document.getElementById('label-role').textContent = dict.role;
        document.getElementById('btn-therapist').textContent = dict.therapist;
        document.getElementById('btn-patient').textContent = dict.patient;
        document.getElementById('text-share-inst').textContent = dict.share_inst;
        document.getElementById('panic-stop-btn').textContent = dict.panic;
        document.getElementById('label-bls').textContent = dict.bls;
        document.getElementById('label-speed').textContent = dict.speed;
        document.getElementById('label-duration').textContent = dict.duration;
        document.getElementById('label-intensity').textContent = dict.intensity;
        document.getElementById('left-label').textContent = dict.left_m;
        document.getElementById('right-label').textContent = dict.right_m;
        document.getElementById('alert-stopped').textContent = dict.t_alert_stop;
        document.getElementById('alert-ready').textContent = dict.t_alert_ready;
        document.getElementById('txt-rost-t').textContent = dict.txt_t;
        document.getElementById('txt-rost-p').textContent = dict.txt_p;
        
        if(userRole === 'therapist') {
            document.getElementById('input-heading').textContent = dict.t_heading;
            joinBtn.textContent = dict.btn_start;
        } else {
            document.getElementById('input-heading').textContent = dict.p_heading;
            joinBtn.textContent = dict.btn_join;
        }
        updateUIValues();
    }

    selector.addEventListener('change', (e) => applyLocalization(e.target.value));

    const socket = io();
    const setupBox = document.getElementById('setup-box');
    const btnTherapist = document.getElementById('btn-therapist');
    const btnPatient = document.getElementById('btn-patient');
    const inputHeading = document.getElementById('input-heading');
    const tView = document.getElementById('therapist-code-view');
    const pView = document.getElementById('patient-code-view');
    const codeText = document.getElementById('generated-code-text');
    const roomInput = document.getElementById('room-input');
    const joinBtn = document.getElementById('join-btn');
    const appContent = document.getElementById('app-content');

    const statusDiv = document.getElementById('status');
    const powerSwitch = document.getElementById('power-switch');
    const speedSlider = document.getElementById('speed');
    const durationSlider = document.getElementById('duration');
    const intensitySlider = document.getElementById('intensity');
    const panicStopBtn = document.getElementById('panic-stop-btn');
    
    const speedVal = document.getElementById('speed-val');
    const durationVal = document.getElementById('duration-val');
    const intensityVal = document.getElementById('intensity-val');
    
    const leftLabel = document.getElementById('left-label');
    const rightLabel = document.getElementById('right-label');
    const rosterTDot = document.getElementById('roster-t-dot');
    const rosterPDot = document.getElementById('roster-p-dot');
    const alertStoppedBanner = document.getElementById('alert-stopped');
    const alertReadyBanner = document.getElementById('alert-ready');
    const therapistBadgeFrame = document.getElementById('therapist-badge-frame');

    let gamepadIndex = null;
    let isLeftTurn = true;
    let inRoom = false;
    let userRole = 'therapist';
    let activeRoomCode = "";

    const speedMapping = {
        1: 1500, 2: 1200, 3: 1000, 4: 800, 5: 650, 6: 500, 7: 400, 8: 320, 9: 250, 10: 180
    };

    // --- Dynamic Web Worker Setup ---
    const workerCode = `
        let timer = null;
        self.onmessage = function(e) {
            if (e.data.action === 'start') {
                if (timer) clearInterval(timer);
                timer = setInterval(() => {
                    self.postMessage('tick');
                }, e.data.interval);
            } else if (e.data.action === 'stop') {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }
        };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function(e) {
        if (e.data === 'tick') {
            triggerVibrationPulse();
        }
    };
    // ---------------------------------

    function makeRandomCode() {
        const characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 4; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result.toUpperCase();
    }

    activeRoomCode = makeRandomCode();
    codeText.textContent = activeRoomCode;

    function setRole(role) {
        userRole = role;
        const dict = translations[currentLang];
        if (role === 'therapist') {
            document.body.classList.remove('select-patient');
            btnTherapist.classList.add('active');
            btnPatient.classList.remove('active');
            inputHeading.textContent = dict.t_heading;
            tView.style.display = "block";
            pView.style.display = "none";
            joinBtn.textContent = dict.btn_start;
        } else {
            document.body.classList.add('select-patient');
            btnTherapist.classList.remove('active');
            btnPatient.classList.add('active');
            inputHeading.textContent = dict.p_heading;
            tView.style.display = "none";
            pView.style.display = "block";
            joinBtn.textContent = dict.btn_join;
        }
    }

    btnTherapist.addEventListener('click', () => setRole('therapist'));
    btnPatient.addEventListener('click', () => setRole('patient'));

    joinBtn.addEventListener('click', () => {
        if (userRole === 'therapist') {
            window.activeRoom = activeRoomCode;
            document.body.classList.add('is-therapist');
            therapistBadgeFrame.textContent = "Code: " + window.activeRoom;
        } else {
            window.activeRoom = roomInput.value.trim().toUpperCase();
            if (window.activeRoom.length !== 4) {
                alert(translations[currentLang].err_code);
                return;
            }
            document.body.classList.remove('is-therapist');
        }

        document.getElementById('lang-picker-wrapper').style.display = "none";
        socket.emit('joinRoom', { roomCode: window.activeRoom, role: userRole });
        
        setupBox.style.display = 'none';
        appContent.classList.add('active');
        inRoom = true;

        if (userRole === 'patient') {
            document.body.classList.add('is-patient');
            statusDiv.textContent = translations[currentLang].status_wait;
            statusDiv.className = "status connected";
            scanForGamepads();
        } else {
            statusDiv.textContent = translations[currentLang].status_active;
            statusDiv.className = "status remote-only";
        }
    });

    function scanForGamepads() {
        if (userRole !== 'patient') return;
        const gamepads = navigator.getGamepads();
        let found = false;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].vibrationActuator) {
                gamepadIndex = i;
                statusDiv.textContent = translations[currentLang].status_ready;
                statusDiv.className = "status connected";
                socket.emit('updateGamepadStatus', { ready: true });
                found = true;
                break;
            }
        }
        if (!found) {
            gamepadIndex = null;
            statusDiv.textContent = translations[currentLang].status_wait;
            statusDiv.className = "status";
            socket.emit('updateGamepadStatus', { ready: false });
        }
        setTimeout(scanForGamepads, 1000);
    }

    function broadcastSettings() {
        if (!inRoom || userRole !== 'therapist') return;
        socket.emit('updateControls', {
            enabled: powerSwitch.checked,
            speed: speedSlider.value,
            duration: durationSlider.value,
            intensity: intensitySlider.value
        });
    }

    [speedSlider, durationSlider, intensitySlider].forEach(slider => {
        slider.addEventListener('input', () => {
            updateUIValues();
            broadcastSettings();
            if (powerSwitch.checked) startRhythm();
        });
    });
    
    powerSwitch.addEventListener('change', () => {
        if (powerSwitch.checked) startRhythm();
        else stopRhythm();
        broadcastSettings();
    });

    panicStopBtn.addEventListener('click', () => {
        powerSwitch.checked = false;
        stopRhythm();
        socket.emit('patientEmergencyStop');
    });

    socket.on('applyControls', (data) => {
        powerSwitch.checked = data.enabled;
        speedSlider.value = data.speed;
        durationSlider.value = data.duration;
        intensitySlider.value = data.intensity;
        
        updateUIValues();

        if (data.enabled) startRhythm();
        else stopRhythm();
    });

    socket.on('sessionStateUpdate', (state) => {
        if (state.therapist) rosterTDot.classList.add('online');
        else rosterTDot.classList.remove('online');

        if (state.patient) rosterPDot.classList.add('online');
        else rosterPDot.classList.remove('online');

        if (userRole === 'therapist') {
            alertReadyBanner.style.display = state.controllerReady ? "block" : "none";
            alertStoppedBanner.style.display = state.stoppedByPatient ? "block" : "none";
        }
    });

    function updateUIValues() {
        const lbl = translations[currentLang].lvl;
        speedVal.textContent = `${lbl} ${speedSlider.value}`;
        durationVal.textContent = `${durationSlider.value} ms`;
        intensityVal.textContent = `${Math.round(intensitySlider.value * 100)}%`;
    }

    function startRhythm() {
        const sliderLevel = parseInt(speedSlider.value);
        const actualInterval = speedMapping[sliderLevel] || 650;
        worker.postMessage({ action: 'start', interval: actualInterval });
    }

    function stopRhythm() {
        worker.postMessage({ action: 'stop' });
        leftLabel.className = "";
        rightLabel.className = "";
        isLeftTurn = true;
    }

    function triggerVibrationPulse() {
        if (!powerSwitch.checked) return;

        const duration = parseInt(durationSlider.value);
        const intensity = parseFloat(intensitySlider.value);
        
        if (userRole === 'patient' && gamepadIndex !== null) {
            const gamepad = navigator.getGamepads()[gamepadIndex];
            if (gamepad && gamepad.vibrationActuator) {
                const leftMag = isLeftTurn ? intensity : 0;
                const rightMag = isLeftTurn ? 0 : intensity;

                gamepad.vibrationActuator.playEffect("dual-rumble", {
                    startDelay: 0,
                    duration: duration,
                    strongMagnitude: leftMag,
                    weakMagnitude: rightMag
                }).catch(() => {});
            }
        }

        if (isLeftTurn) {
            leftLabel.className = "active";
            rightLabel.className = "";
        } else {
            leftLabel.className = "";
            rightLabel.className = "active";
        }

        isLeftTurn = !isLeftTurn;
    }

    applyLocalization("en");
</script>
</body>
</html>
